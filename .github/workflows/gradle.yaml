name: Java CI/CD with Gradle and Docker

on:
  push:
    branches: [ "feat/#27/Github-Actions-CI/CD" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Application.yaml
        run: |
          mkdir -p ./src/main/resources
          cd ./src/main/resources
          echo '${{ secrets.APPLICATION_YAML }}' > application.yaml

      - name: Create EnvFile
        run: |
          echo '${{ secrets.LOCAL_ENV_FILE }}' > ./.env

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.SSH_KEY_FILE }}' > ~/.ssh/id_ed
          chmod 600 ~/.ssh/id_ed
          ssh-keyscan -H ${{ secrets.SSH_HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Start SSH tunnel
        env:
          LOCAL_DB_PORT: ${{ secrets.LOCAL_DB_PORT }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
        run: |
          nohup ssh -i ~/.ssh/id_ed -fN -L ${LOCAL_DB_PORT}:${RDS_ENDPOINT}:${RDS_PORT} ${SSH_USERNAME}@${SSH_HOSTNAME} &
          echo $! > ssh-tunnel.pid
          echo "SSH tunnel started with PID $(cat ssh-tunnel.pid)"

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Stop SSH tunnel
        env:
          LOCAL_DB_PORT: ${{ secrets.LOCAL_DB_PORT }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
        run: |
          echo "Stopping SSH tunnel"
          if [ -f ssh-tunnel.pid ]; then
            PID=$(cat ssh-tunnel.pid)
            echo "Killing SSH tunnel with PID $PID"
            kill $PID || true
            sleep 2
            if pgrep -f "ssh -i ~/.ssh/id_ed -fN -L ${LOCAL_DB_PORT}:${RDS_ENDPOINT}:${RDS_PORT}" > /dev/null; then
              echo "SSH tunnel still running. Forcing termination."
              kill -9 $PID || true
            else
              echo "SSH tunnel stopped successfully"
            fi
            rm ssh-tunnel.pid
          else
            echo "No PID file found. SSH tunnel might not have been started."
          fi
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ci
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Dockerfile and Dockerignore
        run: |
          echo '${{ secrets.DOCKER_FILE }}' > ./Dockerfile
          echo '${{ secrets.DOCKER_IGNORE }}' > ./.dockerignore

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_IMAGE_NAME }}
          build-args: |
            JAR_FILE=build/libs/*.jar

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY_FILE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}
            
            mkdir -p ./home/ubuntu/giwoot_jang
            cd ./home/ubuntu/giwoot_jang
            echo '${{ secrets.DOCKER_ENV_FILE }}' > .env
            echo '${{ secrets.DOCKER_COMPOSE_YAML }}' > compose.yaml
            docker compose -f compose.yaml up -d