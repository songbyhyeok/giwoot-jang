name: Java CI with Gradle

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "SECURITY_NAME=${{ secrets.SECURITY_NAME }}" >> .env
          echo "SECURITY_PASSWORD=${{ secrets.SECURITY_PASSWORD }}" >> .env

      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          host port: 3306                      # 애플리케이션에서 사용하는 포트
          container port: 3306                 # MySQL 컨테이너의 포트
          mysql version: '8.0'                 # MySQL 버전
          mysql database: 'giwoot_jang_schema' # 사용 중인 데이터베이스 이름
          mysql root password: ${{ secrets.MYSQL_ROOT_PASSWORD }} # 'root' 사용자 비밀번호를 GitHub Secrets에 설정
          mysql user: ''                       # 비워두면 root 사용자 사용
          mysql password: ''                   # 비워두면 root 사용자 비밀번호 사용

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@dbbdc275be76ac10734476cc723d82dfe7ec6eda # v3.4.2

      - name: Build with Gradle Wrapper
        run: ./gradlew build
        env:
          SECURITY_NAME: ${{ secrets.SECURITY_NAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@dbbdc275be76ac10734476cc723d82dfe7ec6eda # v3.4.2
