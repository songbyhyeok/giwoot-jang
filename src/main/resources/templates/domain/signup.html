<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">

    <div class="container-xxl border-bottom">
        <p class="text-center text-muted fw-bold fs-2 m-0">회원가입</p>
    </div>

    <div class="container-sm mt-4" style="width:700px; height:630px;">
        <p class="text-muted text-center fs-5 mb-4">
            <span class="fw-bold fs-4">환영합니다!</span> <br>
            지금 회원가입을 완료하고 다양한 혜택을 경험해 보세요.
        </p>

        <div class="border-bottom mb-3">
            <p class="text-start text-muted fs-6 m-0">
                <span class="fw-bold fs-4">회원정보</span> <br>
                표시는 필수 입력 항목이오니 반드시 입력해 주세요.
            </p>
        </div>

        <form>
            <div class="row mb-3">
                <label for="name" class="col-sm-3 col-form-label">이름</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="name">
                </div>
            </div>

            <div class="row mb-3">
                <label for="username" class="col-sm-3 col-form-label">아이디</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="username">
                </div>
            </div>

            <div class="row mb-3">
                <label for="password" class="col-sm-3 col-form-label">비밀번호</label>
                <div class="col-sm-5">
                    <input type="password" class="form-control" id="password">
                </div>
            </div>

            <div class="row mb-3">
                <label for="passwordConfirm" class="col-sm-3 col-form-label">비밀번호 확인</label>
                <div class="col-sm-5">
                    <input type="password" class="form-control" id="passwordConfirm">
                </div>
            </div>

            <div class="row mb-3">
                <label for="email" class="col-sm-3 col-form-label">이메일</label>
                <div class="col-sm-5">
                    <input type="email" class="form-control" id="email" placeholder="songbyhyeok@gmail.com">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="phone1" class="col-sm-3 col-form-label">휴대폰 번호</label>
                <div class="col-sm-9">
                    <div class="row g-2">
                        <div class="col-2">
                            <input type="text" class="form-control" id="phone1" value="010" readonly>
                        </div>
                        <div class="col-2">
                            <input type="text" class="form-control" id="phone2" placeholder="1234">
                        </div>
                        <div class="col-2">
                            <input type="text" class="form-control" id="phone3" placeholder="5678">
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-secondary">인증번호 발송</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-sm-3"></div>
                <div class="col-sm-9">
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="text" class="form-control" id="auth-number" placeholder="인증번호 입력">
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-outline-secondary">재전송</button>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-primary">인증</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3 justify-content-center mt-4">
                <div class="col-sm-2 d-flex justify-content-center">
                    <button type="submit" class="btn btn-secondary w-100">확인</button>
                </div>
            </div>
        </form>

    </div>
</div>

</body>
</html>
