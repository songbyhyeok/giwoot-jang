<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div class="container-sm border" style="width:650px; height:500px;">
    <p class="text-muted fs-3 ms-3 mt-5">
        찾아주셔서 감사합니다.<br>
        <span class="fw-bold fs-3">기웃장</span>에 오신 것을 환영해요.
    </p>

    <form>
        <div class="form-floating">
            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label class="text-muted" for="floatingInput">아이디</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label class="text-muted" for="floatingPassword">비밀번호</label>
        </div>
        <button class="w-100 btn btn-lg btn-secondary mt-3" type="submit">로그인</button>
    </form>

    <button class="w-100 btn btn-lg btn-secondary mt-3" type="submit">회원가입</button>
    <button class="w-100 btn btn-lg btn-success mt-3" type="submit">네이버 로그인</button>
</div>

</body>
</html>
