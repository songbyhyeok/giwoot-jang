<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Modal Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <!-- Trigger button for modal -->
    <button type="button" class="btn btn-primary" onclick="showModal('Information', 'Tsdasd', 'Closess', -2000)">
        Launch Modal
    </button>
</div>

<!-- Modal Structure -->
<div class="modal fade" id="dynamicModal" tabindex="-1" aria-labelledby="dynamicModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dynamicModalLabel">Default Title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="modalMessage">Default message content.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="modalActionBtn">Close
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    // Function to show the modal with dynamic content
    function showModal(title, message, buttonText, autoCloseTime = 0) {
        // 모달의 콘텐츠 요소들을 선택
        const modalTitle = document.getElementById('dynamicModalLabel');
        const modalMessage = document.getElementById('modalMessage');
        const modalActionBtn = document.getElementById('modalActionBtn');
        const modalElement = document.getElementById('dynamicModal');

        // 선택된 요소들이 유효한지 확인
        if (modalTitle && modalMessage && modalActionBtn && modalElement) {
            // 모달의 각 부분에 데이터를 삽입
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalActionBtn.textContent = buttonText;

            // 모달을 초기화하고 표시
            const bootstrapModal = new bootstrap.Modal(modalElement);
            bootstrapModal.show();

            // 지정된 시간이 지나면 모달을 자동으로 닫기
            if (autoCloseTime > 0) {
                setTimeout(() => {
                    bootstrapModal.hide();
                }, autoCloseTime);
            }
        } else {
            console.error('DOM에서 모달 요소를 찾을 수 없습니다.');
        }
    }

</script>
</body>
</html>
