<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Modal Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
  <!-- Trigger button for modal -->
  <button type="button" class="btn btn-primary" onclick="showModal('Information', 'This is a dynamic message!', 'Close', 3000)">
    Launch Modal
  </button>
</div>

<!-- Modal Structure -->
<div class="modal fade" id="dynamicModal" tabindex="-1" aria-labelledby="dynamicModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="dynamicModalLabel">Default Title</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="modalMessage">Default message content.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="modalActionBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
  // Function to show the modal with dynamic content
  function showModal(title, message, buttonText, autoCloseTime = 0) {
    // Update modal content
    document.getElementById('dynamicModalLabel').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalActionBtn').textContent = buttonText;

    // Show the modal
    const modalElement = new bootstrap.Modal(document.getElementById('dynamicModal'));
    modalElement.show();

    // Automatically close the modal after the specified time (in milliseconds)
    if (autoCloseTime > 0) {
      setTimeout(() => {
        modalElement.hide();
      }, autoCloseTime);
    }
  }
</script>
</body>
</html>
