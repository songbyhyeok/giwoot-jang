# 데이터베이스
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/giwoot_jang_schema
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 시큐리티
  security:
    user:
      name: ${SECURITY_NAME}
      password: ${SECURITY_PASSWORD}
