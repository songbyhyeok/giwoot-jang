# 데이터베이스
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/giwoot_jang_schema
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

